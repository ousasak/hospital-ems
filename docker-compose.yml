version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: staffstream-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-staffstream_ems}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - staffstream-net

  redis:
    image: redis:7-alpine
    container_name: staffstream-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - staffstream-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staffstream-backend
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-staffstream_ems}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - postgres
      - redis
    networks:
      - staffstream-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: staffstream-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - staffstream-net

volumes:
  pgdata:
    driver: local

networks:
  staffstream-net:
    driver: bridge

